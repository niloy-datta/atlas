name: atlas

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${ATLAS_DB_NAME:-atlas}
      POSTGRES_USER: ${ATLAS_DB_USER:-atlas}
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:-atlas-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATLAS_DB_USER:-atlas} -d ${ATLAS_DB_NAME:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - atlas

  redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - atlas

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${ATLAS_MAIL_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - atlas

volumes:
  atlas_postgres_data:
  atlas_redis_data:

networks:
  atlas:
    driver: bridge
